<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNA Apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Work apps for the crew — vehicle and overtime logging, overseas OT forms.">
<meta name="theme-color" content="#171B20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNA Apps">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="shell.css">
</head>
<body class="cna-hub">

<div class="cna-wrap">

<div id="cna-home">

  <header class="cna-header cna-header-bare">
    <button id="cna-settings-open" class="cna-gear" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.6 3.6a5 5 0 0 0-6.1 6.4L3.9 15.6a2 2 0 0 0 2.8 2.8l5.6-5.6a5 5 0 0 0 6.4-6.1l-2.9 2.9-2.4-.7-.7-2.4z"/>
      </svg>
    </button>
  </header>

  <div class="cna-today" id="cna-today">
    <span class="cna-today-day" id="cna-today-day"></span>
    <span class="cna-today-date" id="cna-today-date"></span>
  </div>

  <!-- Filled in from the small summary each app leaves for the home
       screen. Empty until at least one app has been opened once. -->
  <div class="cna-strip" id="cna-strip"></div>

  <nav class="cna-apps" id="cna-app-grid" aria-label="Apps">

    <a class="cna-app" href="dot/" data-app-id="dot">
      <span class="cna-app-icon cna-icon-dot" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.7"/>
          <path d="M3.3 10.6h6M15 10.6h5.7M12 14.7V21"/>
        </svg>
      </span>
      <span class="cna-app-label">DOT.log</span>
    </a>

    <a class="cna-app" href="otlog/" data-app-id="otlog">
      <span class="cna-app-icon cna-icon-otlog" aria-hidden="true">
        <!-- a clock, drawn at the same line weight as the steering wheel
             so the whole row reads as one set -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 6.6V12l3.7 2.2"/>
        </svg>
      </span>
      <span class="cna-app-label">OT Tracker</span>
    </a>

    <a class="cna-app" href="ot/" data-app-id="ot">
      <span class="cna-app-icon cna-icon-ot" aria-hidden="true">
        <!-- a plain aeroplane, drawn at the same line weight as the
             steering wheel so the two read as one set -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c.8 0 1.3.8 1.3 1.8v3.9l7.7 4.3v1.9l-7.7-2.2v3.8l2.5 1.8v1.5L12 19l-3.8.8v-1.5l2.5-1.8v-3.8L3 14.9V13l7.7-4.3V4.8C10.7 3.8 11.2 3 12 3z"/>
        </svg>
      </span>
      <span class="cna-app-label">Overseas Tracker</span>
    </a>

    <!-- A shortcut out to the rostering site, not an app stored on the
         phone, so this one needs a connection. -->
    <a class="cna-app" href="https://mediacorp.cloud.farmerswife.com/mobile/index.html"
       data-app-id="fw" data-external="1" target="_blank" rel="noopener noreferrer">
      <span class="cna-app-icon cna-icon-fw" aria-hidden="true">
        <!-- farmerswife's ring-and-fw mark redrawn in the same line weight
             and colour as the other two, so the row reads as one set -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <text x="12" y="12.9" text-anchor="middle" dominant-baseline="middle"
                font-family="Inter Tight, system-ui, sans-serif" font-weight="700"
                font-size="10.8" fill="currentColor" stroke="none">fw</text>
        </svg>
      </span>
      <span class="cna-app-label">farmerswife</span>
    </a>

  </nav>

</div><!-- /cna-home -->


<section id="cna-settings" hidden aria-label="Settings">

  <header class="cna-header">
    <h1>Settings</h1>
    <button id="cna-settings-close" class="cna-gear" type="button" aria-label="Back to apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <h2 class="cna-section-title">Appearance</h2>
  <div class="cna-card">
    <div class="cna-seg" id="cna-theme-picker" role="group" aria-label="Appearance">
      <button type="button" data-theme="light" aria-pressed="false">Day mode</button>
      <button type="button" data-theme="dark" aria-pressed="false">Night mode</button>
      <button type="button" data-theme="auto" aria-pressed="false">Follow phone</button>
    </div>
  </div>

  <h2 class="cna-section-title">Text size</h2>
  <div class="cna-card">
    <div class="cna-seg cna-seg-4" id="cna-size-picker" role="group" aria-label="Text size">
      <button type="button" data-scale="0.9"  aria-pressed="false" style="font-size:12px">Small</button>
      <button type="button" data-scale="1"    aria-pressed="false" style="font-size:14px">Normal</button>
      <button type="button" data-scale="1.15" aria-pressed="false" style="font-size:16px">Large</button>
      <button type="button" data-scale="1.3"  aria-pressed="false" style="font-size:18px">Larger</button>
    </div>
  </div>

  <h2 class="cna-section-title">App updates</h2>
  <div class="cna-card">
    <div id="cna-update-list" class="cna-update-list"></div>
    <button id="cna-check-updates" class="cna-btn" type="button">Check for updates</button>
  </div>

</section>

</div>

<script src="shell.js"></script>
</body>
</html>
